<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фармакология — тренажёр</title>
<style>
:root{
  --bg:#f4f7f7; --card:#ffffff; --ink:#15262a; --muted:#5d7176; --line:#d9e3e4;
  --acc:#0f766e; --acc-ink:#ffffff; --acc-soft:#dff3f0;
  --good:#15803d; --good-bg:#e3f6e8; --bad:#b91c1c; --bad-bg:#fde8e8; --warn:#b45309;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(15,60,60,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1517; --card:#152124; --ink:#e6f0f0; --muted:#8fa7ab; --line:#27393d;
    --acc:#2dd4bf; --acc-ink:#04201c; --acc-soft:#14343a; --good:#4ade80; --good-bg:#12331f; --bad:#f87171; --bad-bg:#3a1717; --warn:#fbbf24; --shadow:none; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:780px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:1.6rem;line-height:1.2;margin:.2em 0}
h2{font-size:1.15rem;margin:1.4em 0 .6em}
.hero{padding:10px 0 4px}.hero p{color:var(--muted);margin:.3em 0 0}.hero.small h1{font-size:1.35rem}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--acc);padding:6px 0;font-size:.95rem}
.link:hover{text-decoration:underline}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;font-weight:600}
.btn small{font-weight:400;color:var(--muted);font-size:.82rem}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary small{color:inherit;opacity:.85}
.btn.good{border-color:var(--good);color:var(--good)}.btn.bad{border-color:var(--bad);color:var(--bad)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.summary,.score{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:10px}
.sumtxt p{margin:.15em 0}
.ring{width:84px;height:84px;border-radius:50%;border:7px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.ring b{font-size:1.25rem}.ring span{font-size:.7rem;color:var(--muted)}
.ring.big{width:104px;height:104px}.ring.g{border-color:var(--good)}.ring.y{border-color:var(--warn)}.ring.r{border-color:var(--bad)}
.topics{display:grid;gap:10px}
.topic{display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"i t c" "i b b";gap:2px 12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.topic:hover{border-color:var(--acc)}
.topic .ico{grid-area:i;font-size:1.8rem;text-align:center}
.topic .tt{grid-area:t;display:flex;flex-direction:column}.topic .tt small{color:var(--muted);font-size:.8rem;line-height:1.3;margin-top:2px}
.topic .cnt{grid-area:c;color:var(--muted);font-size:.85rem;white-space:nowrap}
.topic .bar{grid-area:b;height:6px;background:var(--acc-soft);border-radius:4px;overflow:hidden;margin-top:8px}
.topic .bar i,.pbar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.sheet summary{cursor:pointer;font-weight:600}
mark{background:var(--acc-soft);color:inherit;border-radius:4px;padding:0 3px;font-weight:600}
mark.yes{background:var(--good-bg);color:var(--good)}mark.no{background:var(--bad-bg);color:var(--bad)}
footer{margin-top:28px;font-size:.85rem}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem}
.pbar{height:6px;background:var(--acc-soft);border-radius:4px;margin:6px 0 14px;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.qtype{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:700}
.qq{font-size:1.12rem;line-height:1.4;margin:.4em 0 .9em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .mk{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;margin-top:2px}
.opt.multi .mk{border-radius:5px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}.opt.sel .mk{background:var(--acc);border-color:var(--acc)}
.opt.good{border-color:var(--good);background:var(--good-bg)}.opt.good .mk{background:var(--good);border-color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .mk{background:var(--bad);border-color:var(--bad)}
.opt.miss{border:1.5px dashed var(--good)}
.opt:disabled{opacity:1;color:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.row .btn{align-items:center;text-align:center;min-width:140px}
.fb{margin-top:14px;border-radius:12px}.fb.ok,.fb.no{padding:12px 14px}
.fb.ok{background:var(--good-bg);color:var(--good)}.fb.no{background:var(--bad-bg)}
.fb.no b{color:var(--bad)}.fb.ok{color:var(--ink)}.fb.ok b{color:var(--good)}
.ansline{margin-top:6px;font-weight:600}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px;align-items:center;padding:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.mrow.good{border-color:var(--good);background:var(--good-bg)}.mrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.mrow .hint{grid-column:1/-1;font-size:.88rem;color:var(--good);font-weight:600}
@media(max-width:560px){.mrow{grid-template-columns:minmax(0,1fr)}}
.mrow select{width:100%;min-width:0}
.cloze select{max-width:100%}
.topic{min-width:0}.topic .tt{min-width:0}
.opts,.match,.card{min-width:0}
select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;resize:vertical;margin-bottom:10px}
.cloze{line-height:2.2}.cloze select{margin:0 3px;padding:4px 6px}
select.good{border-color:var(--good);background:var(--good-bg)}select.bad{border-color:var(--bad);background:var(--bad-bg)}
.fix{color:var(--good);font-weight:700}
.order .seq{margin:10px 0;padding:10px 10px 10px 34px;border:1.5px dashed var(--line);border-radius:12px;min-height:46px}
.order .seq li{cursor:pointer;padding:3px 0}.order .seq.good{border-color:var(--good);background:var(--good-bg)}.order .seq.bad{border-color:var(--bad);background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px}.chip:hover{border-color:var(--acc)}
.order .hint{font-weight:600;color:var(--good);margin-top:6px}
.review{border-left:4px solid var(--bad);background:var(--card);border-radius:8px;padding:10px 14px;margin:10px 0;box-shadow:var(--shadow)}
.review p{margin:.25em 0}.review .rq{font-weight:600}.review .ra{color:var(--good);font-weight:600}.review .re{font-size:.88rem}
.ok-all{font-weight:600;color:var(--good)}
.ans{margin-top:14px}.ans .full{font-size:1.05rem}
.ilist{margin:.4em 0;padding-left:1.2em}.ilist li{padding:2px 0}.ilist li.yes{color:var(--good);font-weight:600}.ilist li.no{color:var(--bad);font-weight:600}
.q2{font-weight:600;margin-top:16px}
.parts{display:grid;gap:8px}
.part{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t b" "g b";gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.part .pt{grid-area:t;display:flex;flex-direction:column;min-width:0}.part .pt small{color:var(--muted);font-size:.8rem}
.part .bar{grid-area:g;height:5px;background:var(--acc-soft);border-radius:4px;overflow:hidden}.part .bar i{display:block;height:100%;background:var(--acc)}
.part .pb{grid-area:b;display:flex;gap:6px}
.btn.mini{padding:8px 12px;font-size:.88rem;flex-direction:row;align-items:center;box-shadow:none}
.cnt2{font-size:.85rem;color:var(--muted);margin:-6px 0 10px}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px}.foot label{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== ЯДРО ДАННЫХ: темы, части, помощники для записи материала ===== */
const TOPICS = [
  {id:'1', title:'Тема 1. Общая фармакология', sub:'Что изучает фармакология, лекарственное вещество / средство / препарат, названия, разделы', icon:'📖'},
  {id:'2', title:'Тема 2. Фармакокинетика', sub:'Пути введения, всасывание, биодоступность, распределение, депонирование, биотрансформация, выведение', icon:'💊'},
  {id:'3', title:'Тема 3. Фармакодинамика', sub:'Эффект и механизм действия, виды действия, кумуляция, зависимость, синдром отмены, виды терапии', icon:'🧬'},
  {id:'4', title:'Тема 4. Противомикробные средства и антибиотики', sub:'Антибиотики и резистентность, бета-лактамы, тетрациклины, макролиды, аминогликозиды и другие группы', icon:'🦠'},
  {id:'5', title:'Тема 5. Препараты, влияющие на ЦНС', sub:'Психотропные средства: нейролептики, анксиолитики, седативные, психостимуляторы, ноотропы', icon:'🧠'},
  {id:'6', title:'Тема 6. Анальгетики и средства для наркоза', sub:'Наркотические анальгетики, НПВС, ингаляционный и неингаляционный наркоз, стадии наркоза', icon:'😴'},
  {id:'7', title:'Тема 7. Препараты, влияющие на эфферентную нервную систему', sub:'Холиномиметики и холинолитики, адреномиметики и адреноблокаторы', icon:'⚡'}
];

const Q = [], DEFS = [], GROUPS = [], PARTS = [];
let CUR = '1.1', ORD = 0;
const PART = (id,title) => { CUR = id; PARTS.push({id, topic:id.split('.')[0], title}); };
const reg = o => Object.assign(o,{part:CUR, topic:CUR.split('.')[0], ord:ORD++});

/* вопросы: текст, правильный ответ(ы), неверные варианты, пояснение */
const S  = (q,a,w,e) => Q.push(reg({type:'single',q,correct:[a],wrong:w,e:e||''}));
const M  = (q,a,w,e) => Q.push(reg({type:'multi',q,correct:a,wrong:w,e:e||''}));
const TF = (q,v,e)   => Q.push(reg({type:'tf',q,v,e:e||''}));
const MT = (q,pairs,e) => Q.push(reg({type:'match',q,pairs,e:e||''}));
const OR = (q,items,e) => Q.push(reg({type:'order',q,items,e:e||''}));
/* определение: {{...}} — ключевые слова для пропусков */
const DF = (term,text,note) => DEFS.push(reg({term,text,note:note||''}));
/* группа препаратов / перечень; parts:{поле:'номер части'} — если поля относятся к разным частям */
const GR = (sec,name,o) => GROUPS.push(reg(Object.assign({sec,name,dl:'препараты'},o)));

/* ===== ТЕМА 1. ОБЩАЯ ФАРМАКОЛОГИЯ ===== */
PART('1.1','Что изучает фармакология');
DF('Фармакология','Наука о {{взаимодействии}} лекарственных препаратов с {{организмом}} и о {{поиске}} новых лекарственных средств.');
S('Что входит в область фармакологии?','Действие лекарств на организм и влияние организма на лекарственные препараты',['Только технология изготовления таблеток','Только заболевания органов пищеварения','Только правила выписывания рецептов'],'Фармакология — это всё, что касается лекарств.');

PART('1.2','Лекарственное вещество, средство, препарат');
DF('Лекарственное вещество','Индивидуальное {{химическое соединение}}, используемое для {{приготовления}} лекарственного средства.','Это то, из чего готовят лекарственные средства: например, определённая жидкость или порошок.');
DF('Лекарственное средство','{{Комбинация}} лекарственных веществ, используемая для {{лечения}} и {{профилактики}} болезней.','В состав входят основные действующие вещества и вспомогательные вещества (для лучшей усвояемости основных).');
DF('Лекарственный препарат','Лекарственное средство, приготовленное в виде одной из {{лекарственных форм}}, удобных для {{применения}}.','Формы: раствор, свеча, капсула, мазь, суспензия, микстура и др.');
MT('Соотнесите понятие и его описание',[
 ['Лекарственное вещество','Индивидуальное химическое соединение: жидкость или порошок, из которого готовят средство'],
 ['Лекарственное средство','Комбинация основных действующих и вспомогательных веществ'],
 ['Лекарственный препарат','Средство в удобной форме: раствор, свеча, капсула, мазь, суспензия, микстура']
]);
S('Для чего в лекарственное средство добавляют вспомогательные вещества?','В том числе для лучшей усвояемости основных веществ',['Только для придания цвета','Для замены основного вещества','Для удлинения срока хранения упаковки'],'');

PART('1.3','Названия лекарственных средств');
DF('Международное непатентованное название','Название {{действующего вещества}}.','Именно эти названия необходимо учить. Пример: «Нурофен» — коммерческое название, ибупрофен — МНН.');
DF('Коммерческое (торговое) название','Название, которое присваивает {{фармацевтическая фирма}}, производящая препарат.','Определённой логики в коммерческих названиях, как правило, нет.');
DF('Химическое название','Название, которое отображает {{химическое строение}} вещества.');
S('Какое из названий в паре «Нурофен» — «ибупрофен» является международным непатентованным?','Ибупрофен',['Нурофен','Оба названия','Ни одно из них']);
S('Какие названия должны знать все медицинские работники, чтобы понимать друг друга?','Международные непатентованные (названия действующих веществ)',['Любые коммерческие названия','Только названия фирм-производителей','Только химические формулы']);
S('Что отображает химическое название?','Строение вещества',['Фирму-производителя','Лекарственную форму','Показания к применению']);

PART('1.4','Разделы общей фармакологии');
S('Из каких разделов состоит общая фармакология?','Фармакокинетика и фармакодинамика',['Фармакогнозия и фармакодинамика','Фармакокинетика и токсикология','Фармакотерапия и фармакогенетика']);
S('Что рассматривает фармакокинетика?','Как организм действует на препарат: изменяет, распределяет, метаболизирует и выводит его',['Как препарат действует на организм','Какие препараты бывают','Как изготавливают препараты']);
S('Что рассматривает фармакодинамика?','Как лекарственный препарат действует на организм',['Как организм выводит препарат','Как препарат всасывается из кишечника','Как препарат хранится']);
MT('Что означают корни слов?',[['Кинетика','Движение, путь'],['Динамика','Действие']]);

/* ===== ТЕМА 2. ФАРМАКОКИНЕТИКА ===== */
PART('2.1','Этапы фармакокинетики');
DF('Фармакокинетика','Раздел общей фармакологии, который включает {{всасывание}}, {{распределение}}, {{депонирование}}, {{биотрансформацию}} и {{выведение}} лекарственных средств из организма.','Это путь препарата от попадания в организм до выхода из него — отсюда «кинетика» (движение).');
OR('Расположите этапы пути препарата по организму по порядку',['Всасывание','Распределение','Депонирование','Биотрансформация','Выведение']);
DF('Всасывание','Процесс, в результате которого препарат поступает с {{места его введения}} в {{кровь}}.');
S('От чего прежде всего зависит скорость всасывания?','От пути введения',['От цвета лекарственной формы','От коммерческого названия','От времени суток']);

PART('2.2','Пути введения лекарственных средств');
DF('Энтеральные пути введения','Пути введения с участием органов {{желудочно-кишечного тракта}}.','Enteros — кишечник.');
DF('Парентеральные пути введения','Пути введения {{без участия}} органов {{желудочно-кишечного тракта}}.','Делятся на инъекционные и прочие.');
DF('Инъекционные пути введения','Пути введения с {{нарушением целостности}} кожных покровов.','Injectio — прокол. Все инъекции выполняются иглой.');
GR('route','Энтеральные пути введения',{dl:'пути введения',drugs:['Пероральный (через рот)','Сублингвальный (под язык)','Трансбуккальный (за щёку)','Ректальный (через прямую кишку)']});
GR('route','Инъекционные пути введения',{dl:'пути введения',drugs:['Внутримышечный','Внутривенный','Подкожный','Внутрикожный','Внутрикостный','Внутриартериальный','Внутрисердечный','Околосуставной','Внутрисуставной','Субарахноидальный']});
GR('route','Прочие парентеральные пути введения',{dl:'пути введения',drugs:['Ингаляционный','Введение в естественные полости (рот, глаза, нос, матка, мочевой пузырь)','Введение в раневые карманы (раны, ссадины, ожоговая поверхность)','Накожный (мази, пасты, кремы)']});
S('К какому пути введения относится реакция Манту?','Внутрикожному',['Подкожному','Внутримышечному','Накожному']);
S('Куда вводят препарат при субарахноидальной инъекции?','Под паутинную оболочку спинного или головного мозга',['Под кожу','В полость сустава','В костный мозг'],'Приставка «суб-» — под; арахноидальная оболочка — паутинная.');
M('Что относится к ингаляционному пути введения?',['Ингалятор','Небулайзер','Эндотрахеальная трубка','Маска для ингаляционного наркоза','Кислородное дыхание'],['Шприц с иглой','Ректальная свеча','Глазные капли']);

PART('2.3','Пероральный путь введения');
M('Назовите преимущества перорального пути',['Удобство и техническая простота','Безболезненность','Естественность','Гигиеничность','Разнообразие лекарственных форм для разных пациентов'],['Высокая биодоступность','Быстрое развитие эффекта','Пригодность для экстренной помощи']);

/* ===== ДВИЖОК: сборка заданий из данных (без интерфейса) ===== */
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const uniq = a => [...new Set(a)];
const norm = s => s.toLowerCase().replace(/ё/g,'е');
const stripDef = s => s.replace(/\{\{|\}\}/g,'');

/* «смысловой ключ» — чтобы синонимичные пункты не попадали в неверные варианты */
function key(s){
  let k = norm(s).replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
  if (/дыхательных путей|пневмони|бронхиты/.test(k)) return 'впд';
  if (/поражения кожи|инфекции кожи|стрептодермия/.test(k)) return 'кожа';
  if (/кишечн\w* инфекц/.test(k)) return 'киш';
  if (/гипертонический криз/.test(k)) return 'гк';
  if (/дисбактериоз/.test(k)) return 'дисб';
  if (/судорожн/.test(k)) return 'судор';
  if (/астм/.test(k) && !/усугублен/.test(k)) return 'астма';
  if (/брадикардия|снижение чсс/.test(k)) return 'чсс-';
  if (/тахикардия|повышение чсс/.test(k)) return 'чсс+';
  if (/снижение ад$/.test(k)) return 'ад-';
  if (/повышение ад$/.test(k)) return 'ад+';
  if (/сужение бронхов|спазм бронхов/.test(k)) return 'бр-';
  if (/расширение бронхов/.test(k)) return 'бр+';
  if (/тонуса матки|спазм матки/.test(k)) return 'матка+';
  return k;
}
const FIELDS = ['drugs','ind','eff','side','contra','spec'];
const allKeys = g => new Set(FIELDS.flatMap(f=>(g[f]||[]).map(key)));
/* основы слов длиной от 5 букв — для проверки «подсказки в вопросе» */
const stems = s => uniq(norm(s).replace(/\(.*?\)/g,' ').split(/[^а-яa-z0-9α-ωβ-]+/).filter(w=>w.length>=5).map(w=>w.slice(0,5)));
const leaks = (question, answer) => { const q = stems(question); return stems(answer).some(x=>q.includes(x)); };

const UNITS = [];   // единица = одно задание; конкретная форма строится заново при каждом показе
const addUnit = (id,o,kind,variants,ord) => UNITS.push({id,part:o.part,topic:o.topic,ord:ord!==undefined?ord:o.ord,kind,variants,
  build(){ return this.variants[rnd(this.variants.length)](); }});

function mkChoice(q, correct, wrong, type, e, extra){
  correct = uniq(correct); wrong = uniq(wrong).filter(w=>!correct.includes(w));
  const shownC = (type==='multi' && correct.length>5) ? sample(correct,5) : correct;
  const shownW = wrong.length>4 ? sample(wrong,4) : wrong;
  const opts = shuffle([...shownC.map(text=>({text,ok:true})), ...shownW.map(text=>({text,ok:false}))]);
  let ex = e||'';
  return Object.assign({type, q, opts, ans: correct.join('; '), e: ex}, extra||{});
}

/* ---------- 1. готовые вопросы ---------- */
Q.forEach((o,i)=>{
  const id = 'q'+o.part+'#'+i;
  if (o.type==='single') addUnit(id,o,'single',[()=>mkChoice(o.q,o.correct,o.wrong,'single',o.e)]);
  else if (o.type==='multi') addUnit(id,o,'multi',[()=>mkChoice(o.q,o.correct,o.wrong,'multi',o.e)]);
  else if (o.type==='tf') addUnit(id,o,'tf',[()=>({type:'single',q:'Верно ли утверждение? «'+o.q+'»',opts:shuffle([{text:'Верно',ok:o.v},{text:'Неверно',ok:!o.v}]),ans:o.v?'Верно':'Неверно',e:o.e||''})]);
  else if (o.type==='match') addUnit(id,o,'match',[()=>({type:'match',q:o.q,pairs:o.pairs,e:o.e,rights:shuffle(uniq(o.pairs.map(p=>p[1]))),ans:o.pairs.map(p=>p[0]+' → '+p[1]).join('; ')})]);
  else if (o.type==='order') addUnit(id,o,'order',[()=>{ let s=shuffle(o.items), n=0; while(s.join('|')===o.items.join('|')&&n++<10) s=shuffle(o.items);
      return {type:'order',q:o.q,items:o.items,shown:s,e:o.e,ans:o.items.join(' → ')}; }]);
});

/* ---------- 2. определения: одна единица, несколько форм ---------- */
function otherDefs(d,n){
  const same = shuffle(DEFS.filter(x=>x!==d && x.topic===d.topic));
  const rest = shuffle(DEFS.filter(x=>x!==d && x.topic!==d.topic));
  return [...same,...rest].slice(0,n);
}
DEFS.forEach(d=>{
  d.clean = stripDef(d.text);
  const full = 'Полная формулировка: «'+d.term+' — '+d.clean.charAt(0).toLowerCase()+d.clean.slice(1)+'»'+(d.note?' '+d.note:'');
  const kw = []; d.text.replace(/\{\{(.+?)\}\}/g,(m,w)=>kw.push(w)); d.kw = kw;
  const termLeak = leaks(d.clean, d.term);                 // определение содержит слова термина
  const vDef  = ()=>mkChoice('Что означает понятие «'+d.term+'»? Выберите верное определение.',[d.clean],otherDefs(d,3).map(x=>x.clean),'single',full);
  const vTerm = ()=>mkChoice('Какому понятию соответствует определение: «'+d.clean+'»?',[d.term],otherDefs(d,3).map(x=>x.term),'single',full);
  const vCloze = ()=>{
    const parts=[], blanks=[]; let last=0, m; const re=/\{\{(.+?)\}\}/g;
    while((m=re.exec(d.text))){ parts.push(d.text.slice(last,m.index)); blanks.push(m[1]); parts.push(null); last=re.lastIndex; }
    parts.push(d.text.slice(last));
    const lc = x => x.toLowerCase();
    const pool = uniq(otherDefs(d,8).flatMap(x=>x.kw.map(lc))).filter(w=>!blanks.map(lc).includes(w));
    const bank = shuffle(uniq([...blanks.map(lc), ...sample(pool,Math.max(3,5-blanks.length))]));
    return {type:'cloze',q:'Восстановите определение: «'+d.term+'». Выберите пропущенные слова.',parts,blanks:blanks.map(lc),bank,e:full,ans:d.clean};
  };
  const variants = [vDef];
  if (!termLeak) variants.push(vTerm);
  if (!kw.some(w=>leaks(d.term,w)) && kw.length>=2) variants.push(vCloze);
  addUnit('d:'+d.term,d,'def',variants);
});

/* ---------- 3. группы препаратов и перечни ---------- */
const LABEL = {
  drugs: g => g.dl==='препараты' ? 'Какие препараты относятся к группе «'+g.name+'»?' : 'Что из перечисленного относится к разделу «'+g.name+'» ('+g.dl+')?',
  ind:  g => 'Что из перечисленного является показанием к применению группы «'+g.name+'» (по лекции)?',
  eff:  g => 'Какие фармакологические эффекты характерны для группы «'+g.name+'»?',
  side: g => 'Какие побочные эффекты указаны в лекции для группы «'+g.name+'»?',
  contra: g => 'Какие противопоказания указаны в лекции для группы «'+g.name+'»?',
  spec: g => 'Какие возбудители входят в спектр действия группы «'+g.name+'» (по лекции)?'
};
const FNAME = {drugs:'Перечень',ind:'Показания',eff:'Эффекты',side:'Побочные эффекты',contra:'Противопоказания',spec:'Спектр'};
const REV = {
  ind:  x => 'Какая группа препаратов применяется при: «'+x+'»? (по лекции)',
  eff:  x => 'Какая группа обладает эффектом: «'+x+'»?',
  side: x => 'Для какой группы характерен побочный эффект: «'+x+'»?',
  contra: x => 'Для какой группы указано противопоказание: «'+x+'»?',
  spec: x => 'В спектр действия какой группы входит: «'+x+'»?'
};
function distractors(g, f, n){
  const mine = allKeys(g), seen = new Set((g.excl||[]).map(key)), tiers = [GROUPS.filter(o=>o!==g&&o.sec===g.sec), GROUPS.filter(o=>o!==g&&o.sec!==g.sec)];
  const cand = [];
  for (const tier of tiers){
    shuffle(tier).forEach(o=>(o[f]||[]).forEach(x=>{ const k=key(x); if(mine.has(k)||seen.has(k)) return; seen.add(k); cand.push(x); }));
    if (cand.length>=n*2) break;
  }
  if (cand.length<n){
    const flds=['ind','eff','side','contra','spec'].filter(x=>x!==f);
    shuffle(GROUPS.filter(o=>o!==g)).sort((a,b)=>(b.sec===g.sec)-(a.sec===g.sec)).forEach(o=>flds.forEach(x=>(o[x]||[]).forEach(y=>{ const k=key(y); if(mine.has(k)||seen.has(k)) return; seen.add(k); cand.push(y); })));
  }
  return sample(cand,n);
}
const gexp = (g,f) => 'По лекции — '+FNAME[f].toLowerCase()+' («'+g.name+'»): '+g[f].join('; ')+'.';
const keyCount = {};
GROUPS.forEach(g=>['ind','eff','side','contra','spec'].forEach(f=>(g[f]||[]).forEach(x=>{ const k=f+'|'+key(x); keyCount[k]=(keyCount[k]||0)+1; })));

GROUPS.forEach(g=>{
  FIELDS.forEach((f,fi)=>{
    const list = g[f]||[]; if(!list.length) return;
    const part = (g.parts&&g.parts[f]) || g.part;
    const o = {part, topic:part.split('.')[0], ord:g.ord};
    const ord = g.ord + fi/10;
    const variants = [()=>{
      const multi = list.length>1, nC = multi ? Math.min(list.length, 2+rnd(3)) : 1;
      const correct = sample(list,nC), wrong = distractors(g,f,Math.max(3, Math.min(4, 6-nC)));
      return mkChoice(LABEL[f](g), correct, wrong, multi?'multi':'single', gexp(g,f));
    }];
    if (f==='drugs' || REV[f]){
      const usable = list.filter(x=> f==='drugs' ? GROUPS.filter(o2=>o2!==g&&(o2.drugs||[]).includes(x)).length<=1 : keyCount[f+'|'+key(x)]===1);
      if (usable.length) variants.push(()=>{
        const x = usable[rnd(usable.length)];
        const wrongG = shuffle(GROUPS.filter(o2=>o2!==g && o2.sec===g.sec && (o2[f]||[]).length && !(o2[f]||[]).some(y=>key(y)===key(x))));
        const more = shuffle(GROUPS.filter(o2=>o2!==g && o2.sec!==g.sec && !(o2[f]||[]).some(y=>key(y)===key(x))));
        const names = uniq([...wrongG,...(g.dl==='препараты'?more:[])].map(o2=>o2.name)).filter(n=>n!==g.name).slice(0,3);
        const text = f==='drugs' ? (g.dl==='препараты' ? 'К какой группе относится препарат «'+x+'»?' : 'К какому разделу относится: «'+x+'»?') : REV[f](x);
        return mkChoice(text,[g.name],names,'single',gexp(g,f));
      });
    }
    addUnit('g:'+g.name+':'+f,o,'group',variants,ord);
  });
});

UNITS.sort((a,b)=>a.ord-b.ord);   // порядок лекции
PARTS.forEach(p=>{ p.units = UNITS.filter(u=>u.part===p.id); });

DEFS.forEach(d=>ORAL.push({id:'o:d:'+d.term,part:d.part,topic:d.topic,ord:d.ord,kind:'def',prompt:'Дайте определение: «'+d.term+'»',html:d.text,kw:d.kw,note:d.note}));
GROUPS.forEach(g=>FIELDS.forEach((f,fi)=>{ if((g[f]||[]).length){ const part=(g.parts&&g.parts[f])||g.part;
  ORAL.push({id:'o:g:'+g.name+':'+f,part,topic:part.split('.')[0],ord:g.ord+fi/10,kind:'list',prompt:OP[f](g),items:g[f]}); } }));
Q.forEach((o,i)=>{
  if (o.type==='tf' || /Какое утверждение/.test(o.q)) return;
  const base = {id:'o:q:'+o.part+'#'+i,part:o.part,topic:o.topic,ord:o.ord,note:o.e};

  else if (o.type==='match') ORAL.push(Object.assign(base,{kind:'list',prompt:o.q+' (назовите пары)',items:o.pairs.map(p=>p[0]+' — '+p[1])}));
  else if (o.type==='order') ORAL.push(Object.assign(base,{kind:'list',ordered:true,prompt:o.q,items:o.items}));
});

/* ---------- 5. статистика и выбор вопросов ---------- */
function weight(st){
  if (!st || !st.n) return 3;
  const err = 1 - st.ok/st.n;
  let w = 1 + err*4 + (st.last===0 ? 3 : 0);
  if (st.streak>=3) w = 0.4; else if (st.streak>=2) w = 0.8;
  return w;
}
function pickWeighted(list, n, stats){
  const pool = list.map(s=>({s,w:weight(stats[s.id])})); const out = [];
  while (out.length<n && pool.length){
    const sum = pool.reduce((a,b)=>a+b.w,0); let r = Math.random()*sum, i = 0;
    for (; i<pool.length-1; i++){ r -= pool[i].w; if (r<=0) break; }
    out.push(pool[i].s); pool.splice(i,1);
  }
  return out;
}
const mentions = (text, item) => {
  const t = norm(text), words = norm(item).replace(/\(.*?\)/g,' ').split(/[^а-яa-z0-9α-ωβ-]+/).filter(w=>w.length>=4);
  if (!words.length) return t.includes(norm(item));
  const hit = words.filter(w=>t.includes(w.slice(0,Math.max(4,w.length-3)))).length;
  return hit >= Math.ceil(words.length/2);
};

const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(stats)); } catch(e){} };
const record = (id, ok) => {
  const s = stats[id] || {n:0,ok:0,streak:0,last:null};
  s.n++; if (ok){ s.ok++; s.streak++; } else s.streak = 0; s.last = ok?1:0; stats[id] = s; persist();
};

const app = document.getElementById('app');
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})){ const v = attrs[k];
    if (k==='class') e.className = v; else if (k==='html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v); }
  kids.flat(Infinity).forEach(c=>{ if (c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const esc = s => s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function show(...nodes){ app.replaceChildren(...nodes.flat(Infinity).filter(Boolean)); window.scrollTo(0,0); }
const plural = (n,a,b,c) => { const m=n%100, d=n%10; return (m>10&&m<20)?c:(d===1?a:(d>=2&&d<=4?b:c)); };
const nQ = n => n+' '+plural(n,'вопрос','вопроса','вопросов');

const unitsOf = t => UNITS.filter(u=>u.topic===t);
const seen = u => (stats[u.id]&&stats[u.id].n>0) ? 1 : 0;
const mastered = u => (stats[u.id]&&stats[u.id].last===1) ? 1 : 0;   // последний ответ верный
const partRes = id => (stats._parts||{})[id];
const wrongUnits = t => UNITS.filter(u=>(!t||u.topic===t) && stats[u.id] && stats[u.id].last===0);
const bar = (m,n) => h('span',{class:'bar'},h('i',{style:'width:'+Math.round(n?m/n*100:0)+'%'}));

/* ---------- резервная копия прогресса ---------- */
function saveFile(){
  const blob = new Blob([JSON.stringify(stats)],{type:'application/json'});
  const a = h('a',{href:URL.createObjectURL(blob),download:'фармакология-прогресс.json'}); document.body.append(a); a.click(); a.remove();
}
function loadFile(ev){
  const f = ev.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = ()=>{ try { const d = JSON.parse(r.result); if (typeof d!=='object') throw 0; stats = d; persist(); home(); alert('Прогресс загружен.'); } catch(e){ alert('Не удалось прочитать файл.'); } };
  r.readAsText(f);
}

/* ---------- главная ---------- */
function home(){
  const total = UNITS.length, done = UNITS.filter(mastered).length, tried = UNITS.filter(seen).length;
  const answered = Object.values(stats).reduce((a,b)=>a+(b.n||0),0);
  const wr = wrongUnits().length;
  show(
    h('header',{class:'hero'},
      h('h1',null,'Фармакология: тренажёр'),
      h('p',null,'Темы и части — как в лекциях. В каждой части несколько простых вопросов по порядку, как их задаёт преподаватель.')),
    h('section',{class:'summary'},
      h('div',{class:'ring'}, h('b',null, Math.round(tried/total*100)+'%'), h('span',null,'пройдено')),
      h('div',{class:'sumtxt'},
        h('p',null,'Пройдено: ',h('b',null,tried),' из ',h('b',null,total),' заданий'),
        h('p',null,'Верно в последний раз: ',h('b',null,done)),
        h('p',{class:'muted'},'Ответов дано: '+answered+'. Результаты сохраняются в этом браузере.'))),
    h('h2',null,'Темы'),
    h('div',{class:'topics'}, TOPICS.map(t=>{
      const us = unitsOf(t.id), m = us.filter(mastered).length, tr = us.filter(seen).length, np = PARTS.filter(p=>p.topic===t.id).length;
      return h('button',{class:'topic',onclick:()=>topic(t.id)},
        h('span',{class:'ico'},t.icon),
        h('span',{class:'tt'},h('b',null,t.title),h('small',null,t.sub)),
        bar(tr,us.length),
        h('span',{class:'cnt'},np+' '+plural(np,'часть','части','частей')+' · пройдено '+tr+'/'+us.length));
    })),
    h('h2',null,'Вперемешку и экзамен'),
    h('section',{class:'actions'},
      h('button',{class:'btn',html:'🎲 Вперемешку <small>20 вопросов по всем темам</small>',onclick:()=>startQuiz({title:'Вперемешку по всем темам',slots:pickWeighted(UNITS,20,stats),mode:'practice',back:home})}),
      h('button',{class:'btn',html:'📝 Экзамен <small>30 вопросов, ответы — в конце</small>',onclick:()=>startQuiz({title:'Экзамен',slots:shuffle(UNITS).slice(0,30),mode:'exam',back:home})}),
      h('button',{class:'btn',disabled:wr?null:'',html:'🔁 Работа над ошибками <small>'+(wr?nQ(wr):'пока нет ошибок')+'</small>',onclick:()=>startQuiz({title:'Работа над ошибками',slots:shuffle(wrongUnits()).slice(0,20),mode:'practice',back:home})})),
    h('footer',null,
      h('p',{class:'muted'},'Исходный материал: лекции по фармакологии. Новых фактов приложение не добавляет.'),
      h('div',{class:'foot'},
        h('button',{class:'link',onclick:saveFile},'💾 Сохранить прогресс в файл'),
        h('label',{class:'link'},'📂 Загрузить прогресс из файла',h('input',{type:'file',accept:'.json',style:'display:none',onchange:loadFile})),
        h('button',{class:'link',onclick:()=>{ if(confirm('Сбросить весь прогресс?')){ stats={}; persist(); home(); } }},'Сбросить прогресс')))
  );
}

/* ---------- страница темы: части по порядку ---------- */
function topic(id){
  const t = TOPICS.find(x=>x.id===id), ps = PARTS.filter(p=>p.topic===id), us = unitsOf(id), back = ()=>topic(id);
  const wr = wrongUnits(id);
  const runPart = i => {
    const p = ps[i], nxt = ps[i+1];
    startQuiz({title:p.id+' '+p.title, slots:p.units, mode:'practice', back, partId:p.id,
      next: nxt ? {label:'Следующая часть: '+nxt.id+' '+nxt.title+' →', fn:()=>runPart(i+1)} : null});
  };
  const oralPart = i => { const p = ps[i]; oral({title:p.id+' '+p.title, cards:ORAL.filter(c=>c.part===p.id), back}); };
  show(
    h('button',{class:'link',onclick:home},'← Все темы'),
    h('header',{class:'hero small'},h('h1',null,t.icon+' '+t.title),h('p',null,t.sub)),
    h('section',{class:'actions'},
      h('button',{class:'btn primary',html:'▶ Вся тема по порядку <small>'+nQ(us.length)+', часть за частью</small>',onclick:()=>startQuiz({title:t.title,slots:us,mode:'practice',back})}),
      h('button',{class:'btn',html:'🗣️ Устный опрос по порядку <small>вопрос — ответ вслух — эталон</small>',onclick:()=>oral({title:'Устно: '+t.title,cards:ORAL.filter(c=>c.topic===id),back})}),
      h('button',{class:'btn',html:'🎲 Вперемешку <small>20 вопросов этой темы</small>',onclick:()=>startQuiz({title:t.title+' — вперемешку',slots:pickWeighted(us,20,stats),mode:'practice',back})}),
      h('button',{class:'btn',html:'📝 Экзамен по теме <small>15 вопросов без подсказок</small>',onclick:()=>startQuiz({title:'Экзамен: '+t.title,slots:shuffle(us).slice(0,15),mode:'exam',back})}),
      h('button',{class:'btn',disabled:wr.length?null:'',html:'🔁 Ошибки <small>'+(wr.length?nQ(wr.length):'нет')+'</small>',onclick:()=>startQuiz({title:'Ошибки: '+t.title,slots:shuffle(wr).slice(0,20),mode:'practice',back})})),
    h('h2',null,'Части темы'),
    h('div',{class:'parts'}, ps.map((p,i)=>{
      const m = p.units.filter(mastered).length, tr = p.units.filter(seen).length, pr = partRes(p.id);
      return h('div',{class:'part'},
        h('div',{class:'pt'},h('b',null,p.id+' '+p.title),h('small',null,nQ(p.units.length)+(tr?' · пройдено '+tr+', верно '+m:' · не пройдено')+(pr?' · последний тест: '+pr.ok+' из '+pr.n:''))),
        bar(tr,p.units.length),
        h('div',{class:'pb'},
          h('button',{class:'btn mini primary',onclick:()=>runPart(i)},'Тест'),
          h('button',{class:'btn mini',onclick:()=>oralPart(i)},'Устно')));
    }))
  );
}

/* ---------- отрисовка вопросов ---------- */
function rChoice(q, onPick){
  const multi = q.type==='multi'; const sel = new Set(); let locked = false; const btns = [];
  const box = h('div',{class:'opts'});
  q.opts.forEach((o,i)=>{
    const b = h('button',{type:'button',class:'opt'+(multi?' multi':'')},h('span',{class:'mk'}),h('span',{class:'tx'},o.text));
    b.addEventListener('click',()=>{ if(locked) return;
      if (multi) sel.has(i)?sel.delete(i):sel.add(i); else { sel.clear(); sel.add(i); }
      btns.forEach((x,j)=>x.classList.toggle('sel',sel.has(j))); onPick&&onPick(); });
    btns.push(b); box.append(b);
  });
  return {el:box, multi, answered:()=>sel.size>0, grade:()=>q.opts.every((o,i)=>!!o.ok===sel.has(i)),
    reveal(){ locked=true; btns.forEach((b,i)=>{ const o=q.opts[i]; b.classList.remove('sel'); b.disabled=true;
      if (o.ok) b.classList.add(sel.has(i)?'good':'miss'); else if (sel.has(i)) b.classList.add('bad'); }); }};
}
function rMatch(q, onPick){
  const rows = []; const box = h('div',{class:'match'});
  q.pairs.forEach(p=>{
    const sel = h('select',null,h('option',{value:''},'— выберите —'),q.rights.map(r=>h('option',{value:r},r)));
    sel.addEventListener('change',()=>onPick&&onPick());
    const hint = h('div',{class:'hint'});
    const row = h('div',{class:'mrow'},h('div',{class:'ml'},p[0]),sel,hint); rows.push({p,sel,row,hint}); box.append(row);
  });
  return {el:box, answered:()=>rows.some(r=>r.sel.value), grade:()=>rows.every(r=>r.sel.value===r.p[1]),
    reveal(){ rows.forEach(r=>{ r.sel.disabled=true; const ok=r.sel.value===r.p[1]; r.row.classList.add(ok?'good':'bad'); if(!ok) r.hint.textContent='Верно: '+r.p[1]; }); }};
}
function rOrder(q, onPick){
  let seq = [], locked=false;
  const pool = h('div',{class:'chips'}), out = h('ol',{class:'seq'}), box = h('div',{class:'order'},h('small',{class:'muted'},'Нажимайте элементы по порядку. Нажатие на выбранный элемент убирает его.'),out,pool);
  const draw = ()=>{ out.replaceChildren(...seq.map((x,i)=>h('li',{onclick:()=>{ if(locked) return; seq.splice(i,1); draw(); onPick&&onPick(); }},x)));
    pool.replaceChildren(...q.shown.filter(x=>!seq.includes(x)).map(x=>h('button',{type:'button',class:'chip',onclick:()=>{ if(locked) return; seq.push(x); draw(); onPick&&onPick(); }},x))); };
  draw();
  return {el:box, answered:()=>seq.length>0, grade:()=>seq.join('|')===q.items.join('|'),
    reveal(){ locked=true; const ok=seq.join('|')===q.items.join('|'); out.classList.add(ok?'good':'bad');
      if(!ok) out.after(h('div',{class:'hint'},'Верный порядок: '+q.items.join(' → '))); pool.replaceChildren(); }};
}
function rCloze(q, onPick){
  const sels = []; const box = h('p',{class:'cloze'});
  q.parts.forEach(p=>{
    if (p===null){ const s = h('select',null,h('option',{value:''},'…'),q.bank.map(w=>h('option',{value:w},w))); s.addEventListener('change',()=>onPick&&onPick()); sels.push(s); box.append(s); }
    else box.append(p);
  });
  // подряд идущие пропуски в перечислении («а, б и в») взаимозаменяемы
  const groups = []; let bi = -1, prevSep = false;
  q.parts.forEach(p=>{ if (p===null){ bi++; if (prevSep && groups.length) groups[groups.length-1].push(bi); else groups.push([bi]); prevSep = false; }
    else prevSep = /^\s*(,|и|или)?\s*$/.test(p) && p.length>0; });
  const gOk = g => g.map(i=>sels[i].value).sort().join('|') === g.map(i=>q.blanks[i]).sort().join('|');
  return {el:box, answered:()=>sels.some(s=>s.value), grade:()=>groups.every(gOk),
    reveal(){ groups.forEach(g=>{ const okG = gOk(g); g.forEach(i=>{ const s=sels[i]; s.disabled=true; const ok = okG || s.value===q.blanks[i];
      s.classList.add(ok?'good':'bad'); if(!ok) s.after(h('span',{class:'fix'},' ['+q.blanks[i]+']')); }); }); }};
}
const RENDER = {single:rChoice, multi:rChoice, match:rMatch, order:rOrder, cloze:rCloze};
const HINTS = {single:'Выберите один вариант', multi:'Выберите все верные варианты из предложенных', match:'Подберите к каждому пункту верное соответствие', order:'Расставьте по порядку', cloze:'Выберите слова в пропуски'};

/* ---------- прохождение теста ---------- */
let Z = null;
function startQuiz(cfg){
  if (!cfg.slots.length){ alert('Для этого режима пока нет заданий.'); return; }
  Z = Object.assign({i:0,res:[],t0:Date.now()},cfg); question();
}
function question(){
  const slot = Z.slots[Z.i], q = slot.build(), exam = Z.mode==='exam';
  let done = false, ctl;
  const fb = h('div',{class:'fb'});
  const last = Z.i===Z.slots.length-1;
  const next = h('button',{class:'btn primary',disabled:exam?null:'',onclick:go},last?'Завершить':'Дальше →');
  const check = h('button',{class:'btn primary',disabled:'',onclick:submit},'Проверить');
  const onPick = ()=>{
    if (ctl.answered()) { check.disabled = false; next.disabled = false; }
    if (!exam && q.type==='single' && !done) submit();
  };
  ctl = RENDER[q.type](q, onPick);
  function submit(){
    if (done || !ctl.answered()) return; done = true;
    const ok = ctl.grade(); ctl.reveal(); record(slot.id, ok);
    Z.res.push({slot,q,ok});
    fb.className = 'fb '+(ok?'ok':'no');
    fb.replaceChildren(...[h('b',null,ok?'Верно!':'Неверно.'),' '+(q.e||''), (ok||!(q.type==='single'||q.type==='multi'))?null:h('div',{class:'ansline'},'Правильный ответ: '+q.ans)].filter(Boolean));
    check.remove(); next.disabled = false;
  }
  function go(){
    if (!done){ const ok = ctl.answered() ? ctl.grade() : false; record(slot.id, ok); Z.res.push({slot,q,ok}); done = true; }
    if (!last){ Z.i++; question(); } else results();
  }
  show(
    h('div',{class:'qtop'},
      h('button',{class:'link',onclick:()=>{ if(confirm('Выйти из теста? Результат этой попытки не сохранится.')) Z.back(); }},'✕ Выйти'),
      h('span',{class:'muted'},Z.title)),
    h('div',{class:'pbar'},h('i',{style:'width:'+Math.round(Z.i/Z.slots.length*100)+'%'})),
    h('div',{class:'cnt2'},'Вопрос '+(Z.i+1)+' из '+Z.slots.length),
    h('section',{class:'card'},
      h('div',{class:'qtype'},HINTS[q.type]+(exam?' · режим экзамена':'')),
      h('h2',{class:'qq'},q.q),
      ctl.el, fb,
      h('div',{class:'row'}, (!exam && q.type!=='single') ? check : null, next))
  );
}
function results(){
  const ok = Z.res.filter(r=>r.ok).length, n = Z.res.length, pct = Math.round(ok/n*100), bad = Z.res.filter(r=>!r.ok);
  if (Z.partId){ stats._parts = stats._parts||{}; stats._parts[Z.partId] = {ok,n,t:Date.now()}; persist(); }
  const sec = Math.round((Date.now()-Z.t0)/1000);
  const mark = pct>=90?5:pct>=75?4:pct>=60?3:2;
  show(
    h('header',{class:'hero small'},h('h1',null,'Результат'),h('p',null,Z.title)),
    h('section',{class:'score'},
      h('div',{class:'ring big '+(pct>=75?'g':pct>=60?'y':'r')},h('b',null,pct+'%'),h('span',null,ok+' из '+n)),
      h('div',{class:'sumtxt'},
        Z.mode==='exam'?h('p',null,'Ориентировочная оценка по пятибалльной шкале: ',h('b',null,mark)):null,
        h('p',{class:'muted'},'Время: '+Math.floor(sec/60)+' мин '+(sec%60)+' с'))),
    h('section',{class:'actions'},
      Z.next ? h('button',{class:'btn primary',onclick:Z.next.fn},Z.next.label) : null,
      bad.length?h('button',{class:'btn'+(Z.next?'':' primary'),onclick:()=>startQuiz({title:'Повтор ошибок: '+Z.title,slots:bad.map(r=>r.slot),mode:'practice',back:Z.back,next:Z.next})},'🔁 Повторить ошибки ('+bad.length+')'):null,
      h('button',{class:'btn',onclick:Z.back},'← Назад')),
    bad.length?h('h2',null,'Разбор ошибок'):h('p',{class:'ok-all'},'Все ответы верны. Отличная работа!'),
    bad.map(r=>h('div',{class:'review'},h('p',{class:'rq'},r.q.q),h('p',{class:'ra'},'Правильно: '+r.q.ans),r.q.e?h('p',{class:'re muted'},r.q.e):null))
  );
}

/* ---------- устный опрос ---------- */
function oral(cfg){
  const cards = cfg.cards; let idx = 0;
  if (!cards.length){ alert('Для этого раздела нет устных вопросов.'); return; }
  const finish = ()=>show(
    h('header',{class:'hero small'},h('h1',null,'Устный опрос пройден'),h('p',null,cfg.title)),
    h('section',{class:'actions'},h('button',{class:'btn primary',onclick:()=>oral(cfg)},'Ещё раз'),h('button',{class:'btn',onclick:cfg.back},'← Назад')));
  const nextCard = ()=>{
    if (idx>=cards.length) return finish();
    const pick = cards[idx++];
    const ta = h('textarea',{rows:3,placeholder:'Ответьте своими словами (можно вслух — тогда просто нажмите «Показать ответ»)'});
    const ans = h('div',{class:'ans'});
    const show1 = h('button',{class:'btn primary',onclick:reveal},'Показать ответ');
    function reveal(){
      show1.remove(); ta.disabled = true; const txt = ta.value.trim();
      if (pick.kind==='def'){
        let f=0, tot=0; const html = esc(pick.html).replace(/\{\{(.+?)\}\}/g,(m,w)=>{ tot++; const hit = txt && mentions(txt,w); if(hit) f++; return '<mark class="'+(txt?(hit?'yes':'no'):'')+'">'+w+'</mark>'; });
        ans.append(h('p',{class:'full'},h('b',null,pick.prompt.replace('Дайте определение: ','')+' — '),h('span',{html})));
        if (pick.note) ans.append(h('p',{class:'muted'},pick.note));
        if (txt) ans.append(h('p',{class:'muted'},'Ключевых слов в вашем ответе: '+f+' из '+tot+' (зелёные — названы, красные — пропущены)'));
      } else if (pick.kind==='text'){
        ans.append(h('p',{class:'full'},pick.text)); if (pick.note) ans.append(h('p',{class:'muted'},pick.note));
      } else {
        const ul = h(pick.ordered?'ol':'ul',{class:'ilist'}); let f=0;
        pick.items.forEach(x=>{ const hit = txt && mentions(txt,x); if(hit) f++; ul.append(h('li',{class:txt?(hit?'yes':'no'):''},x)); });
        ans.append(ul); if (txt) ans.append(h('p',{class:'muted'},'Названо: '+f+' из '+pick.items.length));
        if (pick.note) ans.append(h('p',{class:'muted'},pick.note));
      }
      ans.append(h('p',{class:'q2'},'Оцените себя честно:'),
        h('div',{class:'row'},
          h('button',{class:'btn good',onclick:()=>{ record(pick.id,true); nextCard(); }},'Знал(а)'),
          h('button',{class:'btn bad',onclick:()=>{ record(pick.id,false); nextCard(); }},'Не знал(а) / не полностью')));
    }
    show(
      h('div',{class:'qtop'},h('button',{class:'link',onclick:cfg.back},'✕ Закончить'),h('span',{class:'muted'},cfg.title)),
      h('div',{class:'pbar'},h('i',{style:'width:'+Math.round((idx-1)/cards.length*100)+'%'})),
      h('div',{class:'cnt2'},'Карточка '+idx+' из '+cards.length),
      h('section',{class:'card'},h('div',{class:'qtype'},'Устный ответ'),h('h2',{class:'qq'},pick.prompt),ta,show1,ans));
  };
  nextCard();
}
home();

</script>
</body>
